<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>苏丹的游戏配置阅读器</title>
    <link rel="stylesheet" href="./styles.css" />
    <script data-goatcounter="https://charleyz2021.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <div class="hero__top">
          <div class="hero__copy">
            <h1>苏丹的游戏配置阅读器</h1>
            <p class="hero__lead">
              导入游戏的 config.zip 或 config 文件夹，浏览器会在本地解析这些配置文件。
            </p>
          </div>
          <div class="hero__meta muted">
            <span id="appVersion">版本</span>
            <a class="hero__repo-link" href="https://github.com/charleyz2021/sultan-config-reader" target="_blank" rel="noreferrer" aria-label="GitHub 仓库">
              <svg class="hero__repo-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 2C6.48 2 2 6.58 2 12.22c0 4.52 2.86 8.35 6.84 9.7.5.09.68-.22.68-.49 0-.24-.01-.88-.01-1.73-2.78.62-3.37-1.37-3.37-1.37-.45-1.18-1.11-1.5-1.11-1.5-.91-.64.07-.63.07-.63 1 .07 1.53 1.05 1.53 1.05.9 1.56 2.35 1.11 2.92.85.09-.66.35-1.11.63-1.37-2.22-.26-4.55-1.13-4.55-5.03 0-1.11.39-2.02 1.03-2.73-.1-.26-.45-1.3.1-2.7 0 0 .84-.27 2.75 1.04A9.35 9.35 0 0 1 12 6.96c.85 0 1.71.12 2.51.35 1.91-1.31 2.75-1.04 2.75-1.04.55 1.4.2 2.44.1 2.7.64.71 1.03 1.62 1.03 2.73 0 3.91-2.34 4.77-4.57 5.02.36.32.68.94.68 1.9 0 1.37-.01 2.47-.01 2.81 0 .27.18.59.69.49A10.05 10.05 0 0 0 22 12.22C22 6.58 17.52 2 12 2Z" />
              </svg>
              <span>GitHub 仓库</span>
            </a>
          </div>
        </div>
        <div class="hero__actions">
          <button id="importZipBtn" class="button" type="button">导入 config.zip</button>
          <button id="importFolderBtn" class="button button--ghost" type="button">导入配置文件夹</button>
          <button id="clearCacheBtn" class="button button--ghost" type="button">清除本地数据</button>
        </div>
        <div class="hero__status is-collapsed">
          <div id="importStatus" class="hero__status-summary muted">尚未导入本地配置数据。</div>
          <button id="heroStatusToggle" class="hero__status-toggle" type="button" aria-expanded="false">
            <span class="hero__status-icon" aria-hidden="true"></span>
            <span class="sr-only">展开数据状态</span>
          </button>
          <div class="hero__status-content">
            <div class="hero__hint muted">数据显示不全时请清除本地数据重新导入。</div>
            <div id="generatedAt" class="hero__generated muted"></div>
          </div>
        </div>
        <input id="zipInput" type="file" accept=".zip" hidden />
        <input id="folderInput" type="file" webkitdirectory multiple hidden />
      </header>

      <main class="layout">
        <section class="panel" id="explorer">
          <div class="search-box">
            <div class="search-field">
              <svg class="search-field__icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M10.8 4.5a6.3 6.3 0 1 1 0 12.6 6.3 6.3 0 0 1 0-12.6Zm0 2a4.3 4.3 0 1 0 0 8.6 4.3 4.3 0 0 0 0-8.6Zm4.85 8.08 3.72 3.72-1.42 1.42-3.72-3.72 1.42-1.42Z" />
              </svg>
              <input id="searchInput" class="search" type="search" placeholder="搜索 ID、名称、title、提示词" />
              <label class="search-toggle">
                <input id="exactMatchInput" type="checkbox" />
                <span>精确</span>
              </label>
            </div>
          </div>
          <div class="tabs">
            <button class="tab is-active" data-target="all">全部</button>
            <button class="tab" data-target="cards">卡牌</button>
            <button class="tab" data-target="rites">仪式</button>
            <button class="tab" data-target="events">事件</button>
            <button class="tab" data-target="loots">随机池</button>
            <button class="tab" data-target="endings">结局</button>
            <button class="tab" data-target="afterStory">后日谈</button>
            <button class="tab" data-target="quests">一千零一夜</button>
          </div>
          <div id="cardSubtabs" class="subtabs" hidden>
            <button class="subtab is-active" data-card-filter="all">全部卡牌</button>
            <button class="subtab" data-card-filter="sudan">苏丹卡</button>
            <button class="subtab" data-card-filter="item">物品</button>
            <button class="subtab" data-card-filter="char">角色</button>
          </div>
          <div id="riteSubtabs" class="subtabs" hidden>
            <button class="subtab is-active" data-rite-filter="all">全部仪式</button>
            <button class="subtab" data-rite-filter="TREASURE">奇珍</button>
          </div>
          <div id="explorerMeta" class="muted">尚未导入本地配置数据</div>
          <div class="reader-layout">
            <div id="explorerList" class="stack"></div>
            <aside id="detailPane" class="detail-pane">
              <div class="detail-pane__empty">先导入本地配置数据，然后从左侧选择一条配置查看详情。</div>
            </aside>
          </div>
        </section>
      </main>
    </div>

    <div id="detailModal" class="detail-modal" hidden>
      <div id="detailModalBackdrop" class="detail-modal__backdrop"></div>
      <div class="detail-modal__panel">
        <div class="detail-modal__topbar">
          <div class="detail-modal__topbar-left">
            <button id="detailModalBack" class="detail-modal__back" type="button" hidden>返回</button>
            <div class="detail-modal__title">详情信息</div>
          </div>
          <button id="detailModalClose" class="detail-modal__close" type="button">关闭</button>
        </div>
        <div id="detailModalContent" class="detail-modal__content"></div>
      </div>
    </div>

    <div id="cardPreview" class="card-preview" hidden>
      <div id="cardPreviewBackdrop" class="card-preview__backdrop"></div>
      <div class="card-preview__panel">
        <div class="card-preview__topbar">
          <div class="card-preview__topbar-left">
            <button id="cardPreviewBack" class="card-preview__back" type="button" hidden>返回</button>
            <div class="card-preview__title">详情信息</div>
          </div>
          <button id="cardPreviewClose" class="card-preview__close" type="button">关闭</button>
        </div>
        <div id="cardPreviewContent" class="card-preview__content"></div>
      </div>
    </div>

    <button id="scrollTopBtn" class="scroll-top-button" type="button" aria-label="返回顶部" title="返回顶部" hidden>
      ↑
    </button>

    <script defer src="./vendor/jszip.min.js"></script>
    <script defer src="./translation-dicts.js"></script>
    <script defer src="./app.js"></script>
  </body>
</html>
